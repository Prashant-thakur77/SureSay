[project]
name = "suresay"
version = "0.1.0"
description = "A voice assistant for atypical speech: three big guesses, and nothing happens until you confirm one."
readme = "README.md"
license = "MIT"
authors = [{ name = "Prashant Thakur" }]
requires-python = ">=3.12"
dependencies = [
    "confirm-gate-mcp",
    "mcp>=2.1,<2.2",              # strands-agents pins mcp<2.2
    "strands-agents>=1.61",
    "bedrock-agentcore>=1.24",
    "boto3>=1.40",
    "pydantic>=2.10",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "jellyfish>=1.1",
    "amazon-transcribe>=0.6.2",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
nova-sonic = ["aws-sdk-bedrock-runtime>=0.12", "smithy-http[awscrt]>=0.6"]  # Amazon Nova 2 Sonic as a recogniser
dev = ["pytest>=8", "pytest-asyncio>=0.24", "moto[dynamodb,s3]>=5", "ruff>=0.6"]

[project.scripts]
suresay-hub = "suresay.hub:main"

[tool.uv.sources]
confirm-gate-mcp = { path = "packages/confirm-gate-mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suresay", "mcp_server", "strands_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM108", "B008"]
