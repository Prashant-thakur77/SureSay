<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:600px;height:900px;background:#14213d;font-family:system-ui,sans-serif;color:#fbf8f3;display:flex;flex-direction:column;padding:48px 40px;box-sizing:border-box}
h1{font-size:44px;margin:0 0 8px} p{font-size:24px;margin:0 0 28px;color:#e4e7ef}
.g{background:linear-gradient(90deg,#FFB547,#FF6B5A,#7B5CFF);-webkit-background-clip:text;color:transparent}
.heard{font-style:italic;color:#c9d1e0;font-size:22px;margin-bottom:14px}
.c{display:flex;gap:18px;align-items:center;background:#fbf8f3;color:#14213d;border-radius:22px;padding:22px;margin-bottom:16px;font-size:28px;font-weight:700;border-left:12px solid}
.n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:28px;flex:none}
.f{margin-top:auto;font-size:22px;color:#c9d1e0}
</style></head><body>
<h1>Sure<span class="g">Say</span></h1><p>Three guesses. Nothing happens until you choose.</p>
<div class="heard">I heard: “van on”</div>
<div class="c" style="border-color:#c2410c"><span class="n" style="background:#c2410c">1</span>Turn on the bedroom fan</div>
<div class="c" style="border-color:#0f766e"><span class="n" style="background:#0f766e">2</span>Turn on the TV</div>
<div class="c" style="border-color:#6d28d9"><span class="n" style="background:#6d28d9">3</span>Turn off the bedroom fan</div>
<div class="f">Say “two”, “the second one” or “haan”, or tap. Only your own confirmation acts.</div>
</body></html>
