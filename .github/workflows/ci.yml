name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    name: gate + hub + safety suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} .venv && uv pip install --python .venv -e ".[dev]"
      - name: lint
        run: .venv/bin/ruff check suresay mcp_server strands_agent eval infra tests packages/confirm-gate-mcp/src packages/confirm-gate-mcp/tests
      - name: confirm gate (MemoryStore, SQLite, DynamoDB via moto)
        run: cd packages/confirm-gate-mcp && ../../.venv/bin/python -m pytest -q
      - name: hub end to end, OAuth, Alexa skill, Nova Sonic protocol
        run: .venv/bin/python -m pytest -q
      - name: 50-case adversarial safety suite (scripted arms)
        run: .venv/bin/python eval/run_safety_suite.py --arms suresay_adversary,suresay_linked_adversary,plain_obedient --run ci
  web:
    name: web client (typecheck, 150+ tests incl. axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
